services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: loyaltyhub-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Password123"
    ports:
      - "1433:1433"
    volumes:
      - loyaltyhub_sql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Your_strong_Password123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  loyalty-api:
    build:
      context: .
      dockerfile: src/Services/Loyalty/Dockerfile
    container_name: loyaltyhub-loyalty-api
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: "http://+:8080"
      Kestrel__GrpcHttp2Port: "8081"
      ConnectionStrings__LoyaltyDb: "Server=sqlserver;Database=LoyaltyHub_Loyalty_Staging;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;Encrypt=False"
      AppSettings__Version: "S"
      AppSettings__Environment: "Staging"
      AppSettings__IsSwaggerActivated: "true"
      AppSettings__IsSeedDataActivated: "false"
      AppSettings__IsGrpcReflectionActivated: "true"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  loyaltyhub_sql_data:
