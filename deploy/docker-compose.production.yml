# Production stack for LoyaltyHub (SQL Server + Loyalty microservice).
# From repo root:
#   cp deploy/.env.production.example deploy/.env.production
#   docker compose -f deploy/docker-compose.production.yml --env-file deploy/.env.production up -d --build
# Do NOT commit deploy/.env.production.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: loyaltyhub-sql-production
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1434:1433"
    volumes:
      - loyaltyhub_sql_production_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  loyalty-api:
    build:
      context: ..
      dockerfile: src/Services/Loyalty/Dockerfile
    image: loyaltyhub-loyalty-api:production
    container_name: loyaltyhub-loyalty-api-production
    ports:
      - "9080:8080"
      - "9081:8081"
    env_file:
      - .env.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  loyaltyhub_sql_production_data:
