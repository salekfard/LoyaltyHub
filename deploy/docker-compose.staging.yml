# Staging stack for LoyaltyHub (SQL Server + Loyalty microservice).
# From repo root:
#   cp deploy/.env.staging.example deploy/.env.staging
#   docker compose -f deploy/docker-compose.staging.yml --env-file deploy/.env.staging up -d --build
# Do NOT commit deploy/.env.staging.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: loyaltyhub-sql-staging
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - loyaltyhub_sql_staging_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  loyalty-api:
    build:
      context: ..
      dockerfile: src/Services/Loyalty/Dockerfile
    image: loyaltyhub-loyalty-api:staging
    container_name: loyaltyhub-loyalty-api-staging
    ports:
      - "8080:8080"
      - "8081:8081"
    env_file:
      - .env.staging
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  loyaltyhub_sql_staging_data:
